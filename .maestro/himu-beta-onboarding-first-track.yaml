appId: com.himu.app
---
- launchApp:
    clearState: true
- assertVisible: "From an emotion to a track"
- tapOn: "Continue"
- tapOn: "Continue"
- tapOn: "Create my first track"
- assertVisible: "Welcome to HiMu"
- tapOn: "Continue beta smoke"
- assertVisible: "Create your DJ"
- setOrientation: LANDSCAPE
- assertVisible: "Create your DJ"
- setOrientation: PORTRAIT
- tapOn: "Edit Genres"
- tapOn: "Chill & Ambient"
- tapOn: "Ambient"
- tapOn: "Done"
- tapOn: "Edit Moods"
- tapOn: "Calm"
- tapOn: "Focus"
- tapOn: "Done"
- tapOn:
    id: "create-dj-sound-action"
- assertVisible: "Choose your DJ's identity"
- tapOn: "Write my own"
- tapOn: "DJ name"
- inputText: "Night Cartographer"
- tapOn: "Identity concept"
- inputText: "Maps patient rhythms into luminous shared journeys."
- tapOn:
    id: "create-dj-identity-action"
- assertVisible: "Review your DJ"
- tapOn: "Bring my DJ to life"
- assertVisible: "Confirm your track"

